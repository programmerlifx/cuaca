<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263A">
<title>Prediksi Cuaca</title>
<style>
:root{--ink:#10233A;--glass:rgba(255,255,255,.16);--line:rgba(255,255,255,.18);--text:#fff;--muted:rgba(255,255,255,.74);--bg1:#2F6DB5;--bg2:#8FC1E3;--sun:#FFD166;--r:20px}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:linear-gradient(175deg,var(--bg1),var(--bg2));background-attachment:fixed;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);transition:background .6s;-webkit-font-smoothing:antialiased}
body.cerah{--bg1:#1F5FAE;--bg2:#F0B24A}
body.berawan{--bg1:#486582;--bg2:#A9BCCB}
body.hujan{--bg1:#16283A;--bg2:#5B7083}
body.badai{--bg1:#16121F;--bg2:#4B4466}
body.malam{--bg1:#0B1426;--bg2:#2A3F66}
main{max-width:480px;margin:0 auto;position:relative}
.bar-cari{display:flex;gap:8px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar-cari input{flex:1;min-width:0;border:0;background:none;color:var(--text);font-size:1rem;padding:9px 0}
.bar-cari input::placeholder{color:var(--muted)}
.bar-cari input:focus-visible{outline:0}
.bar-cari:focus-within{border-color:#fff}
button{border:0;border-radius:999px;height:40px;padding:0 16px;font-size:.95rem;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
button.ghost{width:40px;padding:0;background:rgba(255,255,255,.22);color:#fff;font-size:1.1rem}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hasil{list-style:none;padding:6px;margin-top:8px;background:var(--ink);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.35);position:absolute;left:0;right:0;z-index:5}
.hasil button{width:100%;height:auto;text-align:left;background:none;color:#fff;border-radius:12px;font-weight:400;padding:12px}
.hasil button:hover{background:rgba(255,255,255,.1)}
.hasil .status{padding:12px}
.hero{text-align:center;padding:34px 0 10px}
.kota{font-size:1.1rem;font-weight:600;letter-spacing:.01em}
.tgl{color:var(--muted);font-size:.9rem;margin-top:2px}
.ikon{font-size:4.2rem;line-height:1;margin:18px 0 4px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))}
.suhu{font-size:5.8rem;font-weight:200;line-height:1;letter-spacing:-.05em;padding-left:.35em}
.suhu sup{font-size:2rem;font-weight:300;vertical-align:top;position:relative;top:.7rem;letter-spacing:0}
.kondisi{font-size:1.25rem;font-weight:500;margin-top:6px}
.pil{display:inline-flex;gap:14px;margin-top:14px;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:.92rem}
section{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
h2{font-size:.9rem;font-weight:600;color:var(--muted);margin-bottom:12px}
.jam{display:flex;gap:4px;overflow-x:auto;margin:0 -6px;padding:0 6px 6px;scrollbar-width:none}
.jam::-webkit-scrollbar{display:none}
.j{flex:0 0 58px;text-align:center;font-size:.88rem;padding:10px 0;border-radius:16px}
.j.kini{background:rgba(255,255,255,.22)}
.j .t{color:var(--muted);font-size:.8rem}
.j .i{font-size:1.5rem;margin:8px 0 6px}
.j b{font-weight:600}
.j .h{color:#BFE3FF;font-size:.75rem;height:1em;margin-top:4px}
.hari{display:grid;grid-template-columns:62px 28px 36px 28px 1fr 28px;gap:8px;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:.95rem}
.hari:first-of-type{border-top:0;padding-top:2px}
.hari .p{color:#BFE3FF;font-size:.8rem}
.hari .lo{color:var(--muted);text-align:right}
.hari .hi{text-align:right;font-weight:600}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.22);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#9CD3FF,var(--sun))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>div{background:rgba(255,255,255,.1);border-radius:16px;padding:12px 14px}
.grid em{font-style:normal;font-size:1.2rem}
.grid b{display:block;font-size:1.3rem;font-weight:500;margin-top:6px}
.grid span{color:var(--muted);font-size:.82rem}
.status{padding:28px 4px;color:var(--muted);text-align:center}
.sk{height:14px;border-radius:7px;background:rgba(255,255,255,.2);margin:14px auto;animation:b 1.2s ease-in-out infinite}
@keyframes b{50%{opacity:.4}}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .6s}
body.hujan .rain,body.badai .rain{opacity:.45}
.rain i{position:absolute;top:-20px;width:1.5px;height:18px;background:#cfe6ff;animation:t linear infinite}
@keyframes t{to{transform:translateY(110vh)}}
@media (prefers-reduced-motion:reduce){.rain{display:none}body{transition:none}.sk{animation:none}}

button.ghost{display:grid;place-items:center}
.ic{display:block;flex:none}
.ic .s{stroke:var(--sun)}
.ic-moon{color:#DCE6FF}
.ic-drop{color:#BFE3FF}
.ikon{display:flex;justify-content:center;font-size:0;margin:20px 0 6px}
.pil span{display:inline-flex;align-items:center;gap:3px}
.j .i{display:flex;justify-content:center;font-size:0;margin:8px 0 6px}
.j .h{display:flex;justify-content:center;align-items:center;gap:2px}
.hi-ic{display:flex;justify-content:center}
.grid em{display:block;font-size:0;opacity:.9}
dialog{position:fixed;inset:auto 0 0 0;width:100%;max-width:none;margin:0;padding:0;border:0;background:transparent;color:#fff}
dialog::backdrop{background:rgba(5,12,24,.55);backdrop-filter:blur(4px)}
.sh{max-width:480px;margin:0 auto;background:#10233A;border-radius:24px 24px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 22px);max-height:88vh;overflow:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:1.1rem}
.lifx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#2F6DB5,#5B4FC9);color:#fff;text-decoration:none}
.lifx small{display:block;opacity:.8;margin-top:2px}
#info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:16px 0;font-size:.92rem}
#info dt{color:var(--muted)}
#info dd{text-align:right;word-break:break-word}
#koor{display:flex;gap:8px}
#koor input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);color:#fff;padding:10px 12px;font-size:.95rem}
.aksi{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.aksi button{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;font-weight:500;font-size:.9rem}
.sw{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.92rem}
#json{margin-top:10px;max-height:200px;overflow:auto;background:rgba(0,0,0,.3);border-radius:12px;padding:10px;font-size:.75rem;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body class="cerah">
<div class="rain" id="rain" aria-hidden="true"></div>
<main>
  <form id="cari" class="bar-cari" autocomplete="off">
    <input id="q" type="search" placeholder="Cari kota, mis. Bandung" aria-label="Cari kota">
    <button class="ghost" aria-label="Cari" data-ic="search"></button>
    <button type="button" class="ghost" id="gps" aria-label="Pakai lokasi saya" data-ic="pin"></button>
    <button type="button" class="ghost" id="dev" aria-label="Menu Dev LIFX" data-ic="code"></button>
  </form>
  <ul class="hasil" id="hasil" hidden></ul>
  <div id="isi"><div class="sk" style="width:40%"></div><div class="sk" style="width:70%;height:90px"></div><div class="sk" style="width:90%;height:120px"></div></div>
</main>
<dialog id="dlg" aria-label="Dev LIFX"><div class="sh">
  <div class="sh-h"><b>Dev LIFX</b><button class="ghost" id="tutup" aria-label="Tutup" data-ic="x"></button></div>
  <a class="lifx" href="https://lifx-project.web.id" target="_blank" rel="noopener"><span><b>LIFX Projects</b><small>lifx-project.web.id</small></span><span data-ic="ext" data-s="18"></span></a>
  <dl id="info"></dl>
  <form id="koor"><input id="la" inputmode="decimal" placeholder="Lintang, mis. -6.2" aria-label="Lintang"><input id="lo" inputmode="decimal" placeholder="Bujur, mis. 106.8" aria-label="Bujur"><button>Pakai</button></form>
  <div class="aksi"><button type="button" id="muat2"><span data-ic="refresh" data-s="16"></span>Muat ulang</button><button type="button" id="hapus"><span data-ic="trash" data-s="16"></span>Hapus lokasi tersimpan</button></div>
  <label class="sw"><input type="checkbox" id="raw"> Tampilkan data mentah (JSON)</label>
  <pre id="json" hidden></pre>
</div></dialog>
<script>
const $=s=>document.querySelector(s);
const WMO={0:["Cerah","sun","cerah"],1:["Cerah berawan","partly","cerah"],2:["Berawan sebagian","partly","berawan"],3:["Mendung","cloud","berawan"],45:["Berkabut","fog","berawan"],48:["Kabut beku","fog","berawan"],51:["Gerimis ringan","drizzle","hujan"],53:["Gerimis","drizzle","hujan"],55:["Gerimis lebat","drizzle","hujan"],61:["Hujan ringan","rain","hujan"],63:["Hujan sedang","rain","hujan"],65:["Hujan lebat","rain","hujan"],80:["Hujan lokal","rain","hujan"],81:["Hujan lokal deras","rain","hujan"],82:["Hujan sangat deras","thunder","badai"],95:["Badai petir","thunder","badai"],96:["Badai petir + es","thunder","badai"],99:["Badai petir + es","thunder","badai"]};
const w=c=>WMO[c]||["Tidak diketahui","cloud","berawan"];
const CL="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242";
const P={
sun:'<g class="s"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></g>',
partly:'<g class="s"><path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2M19.07 4.93l-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13"/></g><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>',
cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
fog:'<path d="'+CL+'"/><path d="M16 17H7M17 21H9"/>',
drizzle:'<path d="'+CL+'"/><path d="M8 19v1M8 14v1M16 19v1M16 14v1M12 21v1M12 16v1"/>',
rain:'<path d="'+CL+'"/><path d="M16 14v6M8 14v6M12 16v6"/>',
thunder:'<path d="M6 16.33A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.97"/><path class="s" d="m13 12-3 5h4l-3 5"/>',
moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
wind:'<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/>',
pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
code:'<path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
up:'<path d="m18 15-6-6-6 6"/>',
down:'<path d="m6 9 6 6 6-6"/>',
refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M3 16h5v5"/>',
trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
function ic(n,z){z=z||24;return '<svg class="ic ic-'+n+'" viewBox="0 0 24 24" width="'+z+'" height="'+z+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>'}
function wi(code,malam,z){let n=w(code)[1];if(malam&&(n==="sun"||code===1))n="moon";return ic(n,z)}
let last=null;
const HARI=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const r=n=>Math.round(n);
let lokasi=null;
try{lokasi=JSON.parse(localStorage.getItem("lokasi"))}catch(e){}

function hujanFx(){const el=$("#rain");if(el.children.length)return;for(let i=0;i<60;i++){const d=document.createElement("i");d.style.left=Math.random()*100+"%";d.style.animationDuration=(.6+Math.random()*.6)+"s";d.style.animationDelay=(-Math.random()*1.2)+"s";el.appendChild(d)}}
hujanFx();

async function muat(l){
  lokasi=l;
  try{localStorage.setItem("lokasi",JSON.stringify(l))}catch(e){}
  $("#isi").innerHTML='<div class="sk" style="width:40%"></div><div class="sk" style="width:70%;height:90px"></div><div class="sk" style="width:90%;height:120px"></div>';
  const u="https://api.open-meteo.com/v1/forecast?latitude="+l.lat+"&longitude="+l.lon
   +"&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day"
   +"&hourly=temperature_2m,precipitation_probability,weather_code"
   +"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max"
   +"&timezone=auto&forecast_days=7";
  try{
    const res=await fetch(u);if(!res.ok)throw 0;
    tampil(l,await res.json());
  }catch(e){
    $("#isi").innerHTML='<p class="status">Tidak bisa memuat data. Periksa koneksi internet, lalu coba cari lagi.</p>';
  }
}

function tampil(l,d){
  last=d;
  const c=d.current,k=w(c.weather_code),mlm=!c.is_day;
  document.body.className=c.is_day?k[2]:(k[2]==="hujan"||k[2]==="badai"?k[2]:"malam");
  const now=c.time.slice(0,13);
  let s=d.hourly.time.findIndex(t=>t.slice(0,13)>=now);if(s<0)s=0;
  let jam="";
  for(let i=s;i<s+24&&i<d.hourly.time.length;i++){
    const p=d.hourly.precipitation_probability[i],h=+d.hourly.time[i].slice(11,13);
    jam+='<div class="j'+(i===s?' kini':'')+'"><div class="t">'+(i===s?"Kini":d.hourly.time[i].slice(11,13)+".00")+'</div><div class="i">'+wi(d.hourly.weather_code[i],h<6||h>=18,28)+'</div><b>'+r(d.hourly.temperature_2m[i])+'°</b><div class="h">'+(p>=20?ic("drop",11)+p+"%":"")+'</div></div>';
  }
  const mn=Math.min(...d.daily.temperature_2m_min),mx=Math.max(...d.daily.temperature_2m_max);
  let hari="";
  d.daily.time.forEach((t,i)=>{
    const lo=d.daily.temperature_2m_min[i],hi=d.daily.temperature_2m_max[i];
    const kiri=(lo-mn)/(mx-mn||1)*100,lebar=Math.max((hi-lo)/(mx-mn||1)*100,8);
    const p=d.daily.precipitation_probability_max[i];
    hari+='<div class="hari"><span>'+(i===0?"Hari ini":HARI[new Date(t+"T12:00").getDay()])+'</span><span class="hi-ic">'+wi(d.daily.weather_code[i],false,22)+'</span><span class="p">'+(p>=20?p+"%":"")+'</span><span class="lo">'+r(lo)+'°</span><div class="bar"><i style="left:'+kiri+'%;width:'+lebar+'%"></i></div><span class="hi">'+r(hi)+'°</span></div>';
  });
  const tgl=new Date(c.time).toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
  const uv=r(d.daily.uv_index_max[0]);
  $("#isi").innerHTML=
   '<div class="hero"><div class="kota">'+esc(l.nama)+'</div><div class="tgl">'+tgl+'</div><div class="ikon">'+wi(c.weather_code,mlm,92)+'</div><div class="suhu">'+r(c.temperature_2m)+'<sup>°C</sup></div><div class="kondisi">'+k[0]+'</div><div class="pil"><span>Terasa '+r(c.apparent_temperature)+'°</span><span>'+ic("up",14)+r(d.daily.temperature_2m_max[0])+'°</span><span>'+ic("down",14)+r(d.daily.temperature_2m_min[0])+'°</span></div></div>'
  +'<section><h2>Per jam, 24 jam ke depan</h2><div class="jam">'+jam+'</div></section>'
  +'<section><h2>7 hari ke depan</h2>'+hari+'</section>'
  +'<section><h2>Kondisi saat ini</h2><div class="grid"><div><em>'+ic("drop",22)+'</em><b>'+c.relative_humidity_2m+'%</b><span>Kelembapan</span></div><div><em>'+ic("wind",22)+'</em><b>'+r(c.wind_speed_10m)+' km/j</b><span>Angin</span></div><div><em>'+ic("drizzle",22)+'</em><b>'+c.precipitation+' mm</b><span>Curah hujan</span></div><div><em>'+ic("sun",22)+'</em><b>'+uv+'</b><span>Indeks UV maks hari ini</span></div></div></section>';
}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

$("#cari").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("#q").value.trim();if(!q)return;
  const ul=$("#hasil");ul.hidden=false;ul.innerHTML='<li class="status">Mencari…</li>';
  try{
    const res=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=id&name="+encodeURIComponent(q));
    const j=await res.json();
    if(!j.results){ul.innerHTML='<li class="status">Kota tidak ditemukan. Coba ejaan lain.</li>';return}
    ul.innerHTML="";
    j.results.forEach(x=>{
      const li=document.createElement("li"),b=document.createElement("button");
      b.type="button";b.textContent=[x.name,x.admin1,x.country].filter(Boolean).join(", ");
      b.onclick=()=>{ul.hidden=true;$("#q").value="";muat({lat:x.latitude,lon:x.longitude,nama:x.name})};
      li.appendChild(b);ul.appendChild(li);
    });
  }catch(err){ul.innerHTML='<li class="status">Pencarian gagal. Periksa koneksi internet.</li>'}
});

$("#gps").addEventListener("click",()=>{
  if(!navigator.geolocation){$("#isi").innerHTML='<p class="status">Perangkat tidak mendukung lokasi. Cari kota secara manual.</p>';return}
  navigator.geolocation.getCurrentPosition(
    p=>muat({lat:p.coords.latitude,lon:p.coords.longitude,nama:"Lokasi saya"}),
    ()=>{$("#isi").innerHTML='<p class="status">Izin lokasi ditolak. Aktifkan izin lokasi atau cari kota secara manual.</p>'},
    {timeout:10000});
});

document.querySelectorAll("[data-ic]").forEach(e=>{e.innerHTML=ic(e.dataset.ic,+e.dataset.s||20)});
const dlg=$("#dlg");
function isiDev(){
  const b=(a,v)=>"<dt>"+a+"</dt><dd>"+esc(String(v))+"</dd>";
  let h=b("Versi aplikasi","1.0.0")+b("Sumber data","Open-Meteo");
  if(lokasi&&last)h+=b("Lokasi",lokasi.nama)+b("Koordinat",(+lokasi.lat).toFixed(3)+", "+(+lokasi.lon).toFixed(3))+b("Zona waktu",last.timezone)+b("Data per",last.current.time.replace("T"," "));
  else h+=b("Lokasi","Belum ada data");
  $("#info").innerHTML=h;
  $("#json").textContent=last?JSON.stringify(last,null,1).slice(0,4000)+"\n…":"Belum ada data.";
  $("#hapus").lastChild.textContent="Hapus lokasi tersimpan";
}
$("#dev").addEventListener("click",()=>{isiDev();dlg.showModal()});
$("#tutup").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
$("#raw").addEventListener("change",e=>{$("#json").hidden=!e.target.checked});
$("#muat2").addEventListener("click",()=>{dlg.close();if(lokasi)muat(lokasi)});
$("#hapus").addEventListener("click",()=>{try{localStorage.removeItem("lokasi")}catch(e){}$("#hapus").lastChild.textContent="Terhapus"});
$("#koor").addEventListener("submit",e=>{
  e.preventDefault();
  const la=parseFloat($("#la").value.replace(",",".")),lo=parseFloat($("#lo").value.replace(",","."));
