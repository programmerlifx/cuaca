<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12263A">
<title>Prediksi Cuaca</title>
<style>
:root{--ink:#12263A;--card:rgba(255,255,255,.14);--text:#fff;--muted:rgba(255,255,255,.72);--bg1:#2F6DB5;--bg2:#8FC1E3;--sun:#FFC857}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:linear-gradient(170deg,var(--bg1),var(--bg2));background-attachment:fixed;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);transition:background .6s}
body.cerah{--bg1:#1F5FAE;--bg2:#F2B84B}
body.berawan{--bg1:#4A6580;--bg2:#A9BCCB}
body.hujan{--bg1:#1B2D3F;--bg2:#5B7083}
body.badai{--bg1:#16121F;--bg2:#4B4466}
body.malam{--bg1:#0B1426;--bg2:#2A3F66}
main{max-width:520px;margin:0 auto}
form{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px 14px;border:0;border-radius:12px;background:var(--card);color:var(--text);font-size:1rem}
input::placeholder{color:var(--muted)}
button{border:0;border-radius:12px;padding:12px 14px;font-size:1rem;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
button.ghost{background:var(--card);color:var(--text)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hasil{list-style:none;padding:0;margin-top:8px;background:var(--ink);border-radius:12px;overflow:hidden}
.hasil button{width:100%;text-align:left;background:none;color:#fff;border-radius:0;font-weight:400;border-bottom:1px solid rgba(255,255,255,.1)}
.hero{padding:36px 4px 20px}
.kota{font-size:1.15rem;color:var(--muted)}
.suhu{font-size:6.5rem;font-weight:200;line-height:1;letter-spacing:-.04em;margin:6px 0}
.suhu sup{font-size:2.4rem;font-weight:300;vertical-align:top;position:relative;top:.5rem}
.kondisi{font-size:1.4rem;font-weight:500}
.detail{color:var(--muted);margin-top:4px}
section{background:var(--card);border-radius:18px;padding:14px;margin-top:14px;backdrop-filter:blur(8px)}
h2{font-size:.95rem;font-weight:600;color:var(--muted);margin-bottom:10px}
.jam{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.j{flex:0 0 62px;text-align:center;font-size:.9rem}
.j .i{font-size:1.5rem;margin:4px 0}
.j .h{color:var(--sun);font-size:.78rem;min-height:1em}
.hari{display:grid;grid-template-columns:78px 34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.hari:first-of-type{border-top:0}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#9CD3FF,var(--sun))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid b{display:block;font-size:1.25rem;font-weight:500}
.grid span{color:var(--muted);font-size:.85rem}
.status{padding:30px 4px;color:var(--muted)}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:0}
body.hujan .rain,body.badai .rain{opacity:.5}
.rain i{position:absolute;top:-20px;width:1.5px;height:18px;background:#cfe6ff;animation:t linear infinite}
@keyframes t{to{transform:translateY(110vh)}}
@media (prefers-reduced-motion:reduce){.rain{display:none}body{transition:none}}
</style>
</head>
<body class="cerah">
<div class="rain" id="rain" aria-hidden="true"></div>
<main>
  <form id="cari" autocomplete="off">
    <input id="q" type="search" placeholder="Cari kota, mis. Bandung" aria-label="Cari kota">
    <button>Cari</button>
    <button type="button" class="ghost" id="gps" aria-label="Pakai lokasi saya">📍</button>
  </form>
  <ul class="hasil" id="hasil" hidden></ul>
  <div id="isi"><p class="status">Memuat cuaca…</p></div>
</main>
<script>
const $=s=>document.querySelector(s);
const WMO={0:["Cerah","☀️","cerah"],1:["Cerah berawan","🌤️","cerah"],2:["Berawan sebagian","⛅","berawan"],3:["Mendung","☁️","berawan"],45:["Berkabut","🌫️","berawan"],48:["Kabut beku","🌫️","berawan"],51:["Gerimis ringan","🌦️","hujan"],53:["Gerimis","🌦️","hujan"],55:["Gerimis lebat","🌧️","hujan"],61:["Hujan ringan","🌧️","hujan"],63:["Hujan sedang","🌧️","hujan"],65:["Hujan lebat","🌧️","hujan"],80:["Hujan lokal","🌦️","hujan"],81:["Hujan lokal deras","🌧️","hujan"],82:["Hujan sangat deras","⛈️","badai"],95:["Badai petir","⛈️","badai"],96:["Badai petir + es","⛈️","badai"],99:["Badai petir + es","⛈️","badai"]};
const w=c=>WMO[c]||["Tidak diketahui","❓","berawan"];
const HARI=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const r=n=>Math.round(n);
let lokasi=null;
try{lokasi=JSON.parse(localStorage.getItem("lokasi"))}catch(e){}

function hujanFx(){const el=$("#rain");if(el.children.length)return;for(let i=0;i<60;i++){const d=document.createElement("i");d.style.left=Math.random()*100+"%";d.style.animationDuration=(.6+Math.random()*.6)+"s";d.style.animationDelay=(-Math.random()*1.2)+"s";el.appendChild(d)}}
hujanFx();

async function muat(l){
  lokasi=l;
  try{localStorage.setItem("lokasi",JSON.stringify(l))}catch(e){}
  $("#isi").innerHTML='<p class="status">Memuat cuaca…</p>';
  const u="https://api.open-meteo.com/v1/forecast?latitude="+l.lat+"&longitude="+l.lon
   +"&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day"
   +"&hourly=temperature_2m,precipitation_probability,weather_code"
   +"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max"
   +"&timezone=auto&forecast_days=7";
  try{
    const res=await fetch(u);if(!res.ok)throw 0;
    tampil(l,await res.json());
  }catch(e){
    $("#isi").innerHTML='<p class="status">Tidak bisa memuat data. Periksa koneksi internet, lalu coba cari lagi.</p>';
  }
}

function tampil(l,d){
  const c=d.current,k=w(c.weather_code);
  document.body.className=c.is_day?k[2]:(k[2]==="hujan"||k[2]==="badai"?k[2]:"malam");
  // 24 jam ke depan mulai dari jam sekarang
  const now=c.time.slice(0,13);
  let s=d.hourly.time.findIndex(t=>t.slice(0,13)>=now);if(s<0)s=0;
  let jam="";
  for(let i=s;i<s+24&&i<d.hourly.time.length;i++){
    const p=d.hourly.precipitation_probability[i];
    jam+='<div class="j"><div>'+(i===s?"Kini":d.hourly.time[i].slice(11,13)+":00".slice(0,0)+".00")+'</div><div class="i">'+w(d.hourly.weather_code[i])[1]+'</div><div>'+r(d.hourly.temperature_2m[i])+'°</div><div class="h">'+(p>=20?p+"%":"")+'</div></div>';
  }
  const mn=Math.min(...d.daily.temperature_2m_min),mx=Math.max(...d.daily.temperature_2m_max);
  let hari="";
  d.daily.time.forEach((t,i)=>{
    const lo=d.daily.temperature_2m_min[i],hi=d.daily.temperature_2m_max[i];
    const kiri=(lo-mn)/(mx-mn||1)*100,lebar=Math.max((hi-lo)/(mx-mn||1)*100,8);
    hari+='<div class="hari"><span>'+(i===0?"Hari ini":HARI[new Date(t+"T12:00").getDay()])+'</span><span aria-hidden="true">'+w(d.daily.weather_code[i])[1]+'</span><div class="bar"><i style="left:'+kiri+'%;width:'+lebar+'%"></i></div><span>'+r(lo)+'° / '+r(hi)+'° · '+d.daily.precipitation_probability_max[i]+'%</span></div>';
  });
  const uv=d.daily.uv_index_max[0];
  $("#isi").innerHTML=
   '<div class="hero"><div class="kota">'+esc(l.nama)+'</div><div class="suhu">'+r(c.temperature_2m)+'<sup>°C</sup></div><div class="kondisi">'+k[1]+' '+k[0]+'</div><div class="detail">Terasa '+r(c.apparent_temperature)+'° · Tertinggi '+r(d.daily.temperature_2m_max[0])+'° · Terendah '+r(d.daily.temperature_2m_min[0])+'°</div></div>'
  +'<section><h2>24 jam ke depan</h2><div class="jam">'+jam+'</div></section>'
  +'<section><h2>Prakiraan 7 hari (suhu · peluang hujan)</h2>'+hari+'</section>'
  +'<section><h2>Kondisi saat ini</h2><div class="grid"><div><b>'+c.relative_humidity_2m+'%</b><span>Kelembapan</span></div><div><b>'+r(c.wind_speed_10m)+' km/j</b><span>Angin</span></div><div><b>'+c.precipitation+' mm</b><span>Curah hujan</span></div><div><b>'+r(uv)+'</b><span>Indeks UV maks hari ini</span></div></div></section>';
}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

$("#cari").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=$("#q").value.trim();if(!q)return;
  const ul=$("#hasil");ul.hidden=false;ul.innerHTML='<li class="status">Mencari…</li>';
  try{
    const res=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=5&language=id&name="+encodeURIComponent(q));
    const j=await res.json();
    if(!j.results){ul.innerHTML='<li class="status">Kota tidak ditemukan. Coba ejaan lain.</li>';return}
    ul.innerHTML="";
    j.results.forEach(x=>{
      const li=document.createElement("li"),b=document.createElement("button");
      b.type="button";b.textContent=[x.name,x.admin1,x.country].filter(Boolean).join(", ");
      b.onclick=()=>{ul.hidden=true;$("#q").value="";muat({lat:x.latitude,lon:x.longitude,nama:x.name})};
      li.appendChild(b);ul.appendChild(li);
    });
  }catch(err){ul.innerHTML='<li class="status">Pencarian gagal. Periksa koneksi internet.</li>'}
});

$("#gps").addEventListener("click",()=>{
  if(!navigator.geolocation){$("#isi").innerHTML='<p class="status">Perangkat tidak mendukung lokasi. Cari kota secara manual.</p>';return}
  navigator.geolocation.getCurrentPosition(
    p=>muat({lat:p.coords.latitude,lon:p.coords.longitude,nama:"Lokasi saya"}),
    ()=>{$("#isi").innerHTML='<p class="status">Izin lokasi ditolak. Aktifkan izin lokasi atau cari kota secara manual.</p>'},
    {timeout:10000});
});

muat(lokasi||{lat:-6.2088,lon:106.8456,nama:"Jakarta"});
</script>
</body>
</html>
